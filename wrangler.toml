# Cloudflare Pages (connectat a GitHub). Web estàtica a l'arrel + Functions a /functions.
# Secrets (NO aquí: el repo és públic) — `wrangler pages secret put <NOM> --project-name trazo-clinica`:
#   TURNSTILE_SECRET, BREVO_API_KEY, BREVO_SENDER, WHATSAPP, ADMIN_PASSWORD
name = "trazo-clinica"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "CODIS"
id = "ece48d637fc54c0fb7686a44bc04da6b"

# Contactes de l'estimador (seguiment). Esquema: schema.sql. Llista privada a /admin.
[[d1_databases]]
binding = "LEADS"
database_name = "trazo-leads"
database_id = "51182af3-fad9-492d-bb26-2065b20375b3"
